name: CI

on:
  push:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_composer:
    name: Check composer.json
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        min_stability: ['']
        name_suffix: ['']
        include:
          - php: '8.5'
            min_stability: 'dev'
            name_suffix: ' (dev deps)'

    name: PHP ${{ matrix.php }}${{ matrix.name_suffix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          coverage: xdebug

      - name: Configure stability
        if: "matrix.min_stability != ''"
        run: composer config minimum-stability "${{ matrix.min_stability }}"

      - name: Install Composer dependencies
        run: composer install --ansi --no-interaction --no-progress

      - name: Execute Unit Tests
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          ini-file: development
          coverage: none
      - name: Install dependencies
        run: composer update --ansi --no-interaction --no-progress
      - run: ./vendor/bin/phpstan
